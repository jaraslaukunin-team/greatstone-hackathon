services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:16}
    environment:
      POSTGRES_USER: picpac
      POSTGRES_PASSWORD: picpac
      POSTGRES_DB: picpac
      PGDATA: /var/lib/postgresql/data
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U picpac -d picpac"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
