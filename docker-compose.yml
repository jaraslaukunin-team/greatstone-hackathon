services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:16}
    environment:
      POSTGRES_USER: picpac
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-picpac}
      POSTGRES_DB: picpac
      PGDATA: /var/lib/postgresql/data
    # Порт открыт только на самой машине: на сервере база наружу не смотрит.
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U picpac -d picpac"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      DATABASE_URL: postgres://picpac:${POSTGRES_PASSWORD:-picpac}@db:5432/picpac
      JWT_SECRET: ${JWT_SECRET:?задайте JWT_SECRET в .env}
      FILE_URL_SECRET: ${FILE_URL_SECRET:?задайте FILE_URL_SECRET в .env}
      UPLOAD_DIR: /data/uploads
      DEMO_MODE: ${DEMO_MODE:-false}
      AI_PROVIDER: ${AI_PROVIDER:-stub}
      AIAI_BASE_URL: ${AIAI_BASE_URL:-https://api.aiai.by/v1}
      AIAI_API_KEY: ${AIAI_API_KEY:-}
      AIAI_MODEL: ${AIAI_MODEL:-}
      AIAI_EDIT_MODE: ${AIAI_EDIT_MODE:-images}
      PORT: "3000"
    depends_on:
      db:
        condition: service_healthy
    # Прямой доступ к API только с этой машины (smoke-тест, отладка); наружу его отдаёт caddy.
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - uploads:/data/uploads
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    environment:
      API_DOMAIN: ${API_DOMAIN:-localhost}
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
